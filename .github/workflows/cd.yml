# Build the Docker image, push to Docker Hub, then deploy on EC2 over SSH.
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (not password)
#   EC2_HOST            — public IP or hostname of the EC2 instance
#   EC2_USER            — SSH user (usually ubuntu / ec2-user)
#   EC2_SSH_KEY         — private key contents for SSH into EC2
#
# Optional repository variables (Settings → Variables):
#   EC2_APP_DIR         — remote directory for compose files (default: ~/voice-ai)
#   CONTAINER_NAME      — running container name (default: voice_ai_app)
#   APP_PORT            — host port published to 8000 (default: 8000)

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-ec2
  cancel-in-progress: false

env:
  IMAGE_NAME: voice-ai-appliance-diagnostic-agent

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'voice_ai_app' }}
          APP_PORT: ${{ vars.APP_PORT || '8000' }}
          APP_DIR: ${{ vars.EC2_APP_DIR || '~/voice-ai' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CONTAINER_NAME,APP_PORT,APP_DIR
          script: |
            set -euo pipefail

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Expect a .env on the server (never baked into the image).
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing on the EC2 host."
              echo "Create it once with production secrets, then re-run CD."
              exit 1
            fi

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file .env \
              -p "${APP_PORT}:8000" \
              "$IMAGE"

            docker image prune -f
            docker logout
            echo "Deployed $IMAGE on port $APP_PORT"
